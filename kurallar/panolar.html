<title>Pano Modelleri</title>
<style>
:root{--bg:#f4f3ef;--panel:#fff;--ink:#1c2127;--mute:#69717b;--line:#e2e0da;--accent:#c2410c;--accent-soft:#fff0e6;
--blue:#1d4ed8;--blue-soft:#e8efff;--ok:#047857;--ok-soft:#e5f5ee;--warn:#b45309;--warn-soft:#fff6e0;--chip:#eef0f3;
--label:#fbfbf9;--label-line:#cfd3d8;--shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111316;--panel:#1a1d21;--ink:#e7e9ec;--mute:#9aa3ad;--line:#2b3036;
--accent:#fb923c;--accent-soft:#2d1d12;--blue:#8fb0ff;--blue-soft:#1a2440;--ok:#4ade80;--ok-soft:#12291e;--warn:#f5b54a;--warn-soft:#2d2412;
--chip:#252a30;--label:#e9ebee;--label-line:#9aa3ad;--shadow:none}}
:root[data-theme="dark"]{--bg:#111316;--panel:#1a1d21;--ink:#e7e9ec;--mute:#9aa3ad;--line:#2b3036;--accent:#fb923c;--accent-soft:#2d1d12;
--blue:#8fb0ff;--blue-soft:#1a2440;--ok:#4ade80;--ok-soft:#12291e;--warn:#f5b54a;--warn-soft:#2d2412;--chip:#252a30;--label:#e9ebee;--label-line:#9aa3ad;--shadow:none}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hb{max-width:1320px;margin:0 auto;padding:10px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.logo{width:34px;height:34px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff}
.ht{font-weight:650;line-height:1.2}.hs{font-size:12px;color:var(--mute)}
.tabs{display:flex;gap:6px;margin-left:auto;background:var(--chip);padding:4px;border-radius:10px}
.tabs button{border:0;background:transparent;color:var(--ink);font:600 14px inherit;font-family:inherit;padding:7px 16px;border-radius:7px;cursor:pointer}
.tabs button.on{background:var(--panel);color:var(--accent);box-shadow:var(--shadow)}
.lnk{font-size:13px;color:var(--mute);text-decoration:none;border:1px solid var(--line);padding:6px 10px;border-radius:8px;background:var(--panel)}
.tb{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer}
main{max-width:1320px;margin:0 auto;padding:22px 20px 40px}
.hero{display:flex;gap:20px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.hero h1{margin:0;font-size:34px;letter-spacing:-.02em}.hero .tag{color:var(--accent);font-weight:600;font-size:14px}
.hero p{margin:4px 0 0;color:var(--mute);max-width:640px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px}
.fact{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);position:relative}
.fact span{display:block;font-size:12px;color:var(--mute)}.fact b{font-size:15px}
.fact a{position:absolute;top:10px;right:10px}
.rid{font:600 11px/1 ui-monospace,Consolas,monospace;color:var(--blue);background:var(--blue-soft);border-radius:5px;padding:4px 6px;text-decoration:none;white-space:nowrap}
.grid{display:grid;grid-template-columns:minmax(330px,420px) 1fr;gap:22px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);margin-bottom:22px}
.card h2{margin:0 0 4px;font-size:18px;display:flex;align-items:center;gap:8px}.card .sub{color:var(--mute);font-size:13px;margin:0 0 14px}
.h2i{width:26px;height:26px;border-radius:7px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:14px}
/* ---- etiket ---- */
.labelwrap{display:flex;justify-content:center;padding:6px 0 4px}
.label{width:300px;background:var(--label);border:2px solid var(--label-line);border-radius:6px;padding:16px 12px 14px;position:relative;color:#1b1f24;
box-shadow:inset 0 0 0 4px #fff,0 10px 30px rgba(0,0,0,.12)}
.label .screw{position:absolute;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#9aa1a9);border:1px solid #8a9199}
.brand{text-align:center;font-weight:800;font-size:28px;color:#d4232b;letter-spacing:-.02em;line-height:1}
.brand small{display:block;font-size:9px;color:#333;letter-spacing:.08em;font-weight:700;margin-top:4px}
.lrow{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;justify-items:center;margin-top:16px;gap:4px}
.lrow.wide{grid-template-columns:1fr}
.comp{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:default;position:relative}
.comp .lt{font:700 8.5px/1.15 "Segoe UI",sans-serif;text-align:center;letter-spacing:.03em;max-width:92px;color:#222}
.comp.dim{opacity:.35}
.comp:hover .pop{display:block}
.pop{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--panel);color:var(--ink);border:1px solid var(--line);
border-radius:10px;padding:8px;width:170px;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.2);font-size:11px;text-align:center}
.pop img{width:90px;height:90px;object-fit:contain;display:block;margin:0 auto 4px}
.pop code{font:600 11px ui-monospace,Consolas,monospace}
.estop{width:66px;height:66px;border-radius:50%;background:#f5c400;display:grid;place-items:center;box-shadow:inset 0 0 0 2px #c79f00}
.estop i{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff6b6b,#c1121f 60%,#7d0a12);box-shadow:0 3px 6px rgba(0,0,0,.35)}
.btn{width:40px;height:40px;border-radius:50%;background:linear-gradient(#e9ecef,#9aa1a9);display:grid;place-items:center;box-shadow:0 2px 4px rgba(0,0,0,.25)}
.btn i{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 -3px 6px rgba(0,0,0,.25),inset 0 3px 5px rgba(255,255,255,.5)}
.lamp{width:26px;height:26px;border-radius:50%;background:linear-gradient(#e9ecef,#9aa1a9);display:grid;place-items:center}
.lamp i{width:19px;height:19px;border-radius:50%;box-shadow:inset 0 2px 4px rgba(255,255,255,.6)}
.c-red{background:radial-gradient(circle at 40% 35%,#ff7b7b,#d00000)}.c-green{background:radial-gradient(circle at 40% 35%,#5fe08a,#0b8a3a)}
.c-blue{background:radial-gradient(circle at 40% 35%,#7cc8ff,#0a6fc2)}.c-white{background:radial-gradient(circle at 40% 35%,#fff,#d8dbe0)}
.twin{width:40px;height:62px;border-radius:20px;background:linear-gradient(#e9ecef,#9aa1a9);padding:4px;display:flex;flex-direction:column;gap:3px;box-shadow:0 2px 4px rgba(0,0,0,.25)}
.twin i{flex:1;border-radius:16px 16px 4px 4px}.twin i+i{border-radius:4px 4px 16px 16px}
.sel{width:40px;height:40px;border-radius:50%;background:linear-gradient(#e9ecef,#9aa1a9);display:grid;place-items:center;box-shadow:0 2px 4px rgba(0,0,0,.25)}
.sel i{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle,#2fd36b,#0b7a33);position:relative}
.sel i::after{content:"";position:absolute;left:12px;top:3px;width:6px;height:24px;border-radius:3px;background:#0a5a26;transform:rotate(-30deg)}
.mandal{width:40px;height:40px;border-radius:50%;background:linear-gradient(#e9ecef,#9aa1a9);display:grid;place-items:center;box-shadow:0 2px 4px rgba(0,0,0,.25)}
.mandal i{width:30px;height:30px;border-radius:50%;background:#1d1f22;position:relative}
.mandal i::after{content:"";position:absolute;left:12px;top:3px;width:6px;height:24px;border-radius:3px;background:#555}
.disp{width:66px;height:66px;background:#111;border-radius:4px;border:2px solid #333;padding:4px;display:flex;flex-direction:column;justify-content:space-between}
.disp.big{width:150px;height:74px}
.disp em{font:700 8px sans-serif;color:#ddd;font-style:normal}.disp b{font:700 16px ui-monospace,monospace;color:#ff3b30;text-align:right;text-shadow:0 0 6px #ff3b30}
.hmi{width:170px;height:104px;background:#2a2d31;border-radius:6px;padding:7px}
.hmi i{display:block;height:100%;border-radius:3px;background:linear-gradient(135deg,#0e3a5c,#1f6fa8);position:relative}
.hmi i::after{content:"HMI";position:absolute;inset:0;display:grid;place-items:center;color:#cfe6ff;font:700 13px sans-serif;letter-spacing:.1em}
.pako{width:74px;height:74px;background:#f5c400;border-radius:4px;display:grid;place-items:center;box-shadow:inset 0 0 0 2px #c79f00}
.pako i{width:54px;height:54px;border-radius:50%;background:#d0191f;position:relative}
.pako i::after{content:"";position:absolute;left:22px;top:-2px;width:10px;height:58px;border-radius:5px;background:#e3262c;box-shadow:0 2px 3px rgba(0,0,0,.3)}
.tms{width:74px;height:74px;background:#3a3d42;border-radius:6px;display:grid;place-items:center}
.tms i{width:52px;height:52px;border-radius:50%;background:#16181b;position:relative}
.tms i::after{content:"";position:absolute;left:21px;top:0;width:10px;height:52px;border-radius:5px;background:#2b2e33}
.tapaB{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#444,#0d0d0d)}
.tapaL{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#444,#0d0d0d)}
.ciftel{display:grid;grid-template-columns:auto auto 1fr auto;margin-top:16px;align-items:center;border-top:1px dashed #b9bec5;padding:12px 4px 0;gap:6px}
.ciftel .gap{height:2px;border-top:2px dashed #b9bec5;margin:0 6px;position:relative}
.ciftel .gap span{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font:700 8px sans-serif;color:#8a9199;white-space:nowrap}
.ciftel .col{display:flex;flex-direction:column;gap:46px;align-items:center}
.dimv{height:150px;width:2px;background:#d4232b;position:relative}
.dimv::before,.dimv::after{content:"";position:absolute;left:-5px;width:12px;height:2px;background:#d4232b}.dimv::before{top:0}.dimv::after{bottom:0}
.dimv{margin:0 58px 0 14px}
.dimv span{position:absolute;left:8px;top:50%;transform:translateY(-50%);font:700 9px sans-serif;color:#d4232b;white-space:nowrap}
.lnote{font-size:12px;color:var(--mute);margin-top:12px;text-align:center}
/* ---- opsiyonlar ---- */
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;transition:.15s}
.opt:hover{border-color:var(--accent)}.opt.on{background:var(--accent-soft);border-color:var(--accent)}
.sw{width:38px;height:22px;border-radius:11px;background:var(--line);position:relative;transition:.15s;margin-top:2px}
.sw::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.opt.on .sw{background:var(--accent)}.opt.on .sw::after{left:18px}
.opt b{display:block}.opt p{margin:2px 0 6px;color:var(--mute);font-size:13px}
.minis{display:flex;gap:6px;flex-wrap:wrap}
.mini{display:flex;align-items:center;gap:6px;background:var(--chip);border-radius:7px;padding:3px 8px 3px 3px;font-size:12px}
.mini img{width:24px;height:24px;object-fit:contain;background:#fff;border-radius:5px}
.kbbox{display:flex;gap:10px;margin-top:14px}
.kb{flex:1;border-radius:12px;padding:12px;text-align:center;border:1px solid var(--line)}
.kb b{display:block;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}.kb span{font-size:12px;color:var(--mute)}
.kb.no{background:var(--ok-soft)}.kb.no b{color:var(--ok)}.kb.nc{background:var(--warn-soft)}.kb.nc b{color:var(--warn)}
/* ---- olmazsa olmazlar ---- */
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.item{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel)}
.item .ph{width:64px;height:64px;border-radius:8px;background:#fff;display:grid;place-items:center;border:1px solid var(--line)}
.item .ph img{width:58px;height:58px;object-fit:contain}
.item .nm{font-size:13px;font-weight:600;line-height:1.3}
.item .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}
.code{font:600 11px ui-monospace,Consolas,monospace;background:var(--chip);border-radius:5px;padding:2px 6px}
.qty{font:700 12px sans-serif;color:#fff;background:var(--accent);border-radius:999px;padding:2px 8px}
.qty.txt{background:var(--chip);color:var(--ink);font-weight:600}
.item .nt{font-size:12px;color:var(--mute);margin-top:2px}
.item.series{border-style:dashed}
.item.opt-item{background:var(--accent-soft);border-color:var(--accent)}
.loads{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.load{border-left:4px solid var(--accent);background:var(--chip);border-radius:8px;padding:10px 12px}
.load b{display:block;font-size:14px}.load span{font-size:13px;color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);text-align:center;padding:8px;background:var(--chip)}
td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:middle}
td.c{text-align:center;font-variant-numeric:tabular-nums}
td img{width:32px;height:32px;object-fit:contain;vertical-align:middle;background:#fff;border-radius:5px}
tr.o td{background:var(--accent-soft)}
.tw{border:1px solid var(--line);border-radius:10px;overflow:auto}
ul.rules{list-style:none;margin:0;padding:0}
li.rule{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
li.rule:first-child{border-top:0}
li.rule .rid{text-align:center;height:max-content;margin-top:2px}
.rlabel{font-weight:650;margin-right:4px}.rlabel::after{content:" —";color:var(--mute);font-weight:400}
.chip{font:600 11px ui-monospace,Consolas,monospace;background:var(--chip);border:1px solid var(--line);border-radius:5px;padding:0 5px;white-space:nowrap}
.chip.nophoto{border-style:dashed}
.arrow{color:var(--accent);font-weight:700}
code{font:12px ui-monospace,Consolas,monospace;background:var(--chip);padding:1px 5px;border-radius:4px}
details summary{cursor:pointer;font-weight:600;color:var(--mute);margin-top:6px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
footer{text-align:center;color:var(--mute);font-size:12px;padding:0 0 30px}
@media (max-width:980px){.grid,.cols2{grid-template-columns:1fr}.facts{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){main{padding:16px}.hb{padding:10px 16px}.tabs{margin-left:0;width:100%}.tabs button{flex:1;padding:7px 4px}.hero h1{font-size:28px}}
</style></head>

NcP+3gUNxCF17XR/XB7TC4mhEkS0Zjw9uZO7a1P4ULWZElLpVp9zZoNYLHy6ZFodXTKYOSoCcvGB+Jnt1CS30nE01fQA0ab4pKNREIm7t/sPGZyjeDjtq73WeGeBbYUuOTx8HoUiJs63OFSTirFwTyED80UEmpWsiLNNux3uyo+3YVne+RSHXXK69TtiMfq0WmRgeLUNmPynpnnvhHULcB6YbN2FNd1IZnVYP7QTUCU/8KEQOQ5b5GVbRHLh/LVFYAAAA="}, "rules": {"R0.1": "<li class=\"rule r\" id=\"R0.1\"><a class=\"rid\" href=\"#R0.1\">R0.1</a><div class=\"rbody\">Kullanıcı «elektrik panosu malzeme listesi hazırla», «elektrik kutusu yap», «elektrik kutusu hazırlayalım» veya benzerini dediğinde bu dosyadaki kuralların tamamına uyulur.</div></li>", "R0.2": "<li class=\"rule r\" id=\"R0.2\"><a class=\"rid\" href=\"#R0.2\">R0.2</a><div class=\"rbody\">Kontaktör, termik, MKŞ, sigorta, pako şalter ve röle yalnız bu dosyadaki stoktan seçilir. Başka marka veya listede olmayan kod yazılmaz.</div></li>", "R0.3": "<li class=\"rule r\" id=\"R0.3\"><a class=\"rid\" href=\"#R0.3\">R0.3</a><div class=\"rbody\">Çıktıda malzeme adı (stok adı, tam haliyle) ve stok kodu birlikte yazılır.</div></li>", "R0.4": "<li class=\"rule r\" id=\"R0.4\"><a class=\"rid\" href=\"#R0.4\">R0.4</a><div class=\"rbody\">Seri yetmiyorsa uydurulmaz; yetmediği açıkça yazılır.</div></li>", "R0.5": "<li class=\"rule r\" id=\"R0.5\"><a class=\"rid\" href=\"#R0.5\">R0.5</a><div class=\"rbody\">Kod verilmemiş bir malzemeye kod uydurulmaz.</div></li>", "R0.5a": "<li class=\"rule r\" id=\"R0.5a\"><a class=\"rid\" href=\"#R0.5a\">R0.5a</a><div class=\"rbody\">Stok kodu henüz olmayan malzeme (ör. TMŞ, 6.14) üretici referansıyla yazılır (ör. LV516332); stok kodu yerine «STOK KODU YOK» yazılır. Kod eklenince bu dosyada güncellenir.</div></li>", "R0.6": "<li class=\"rule r\" id=\"R0.6\"><a class=\"rid\" href=\"#R0.6\">R0.6</a><div class=\"rbody\">Panoda (iç, kapak ve etikette) kullanılan <strong>tüm</strong> malzemeler depo listesine yazılır. Paftada veya etikette olup depo listesinde olmayan kalem bırakılmaz (R10.6).</div></li>", "R1.0": "<li class=\"rule r\" id=\"R1.0\"><a class=\"rid\" href=\"#R1.0\">R1.0</a><div class=\"rbody\"><span class=\"rlabel\">Makine modeli</span>Model (KBN 1B, KBN 2B, LYM …) belirtilmediyse <strong>önce bunu sor</strong>; güç kaynağı, kaçak akım, IOF, bara, röle seti ve motor düzeni modele göre değişir (R5.0). Modele bağlı opsiyonları da sor: yağ sıyırıcı (R4.7), interlock kilit (R9.3a), Safety PLC (R8.7), LYM'de sepet invertörü (R4.1), KBN 1B'de döner nozzle (R7.4a).</div></li>", "R1.1": "<li class=\"rule r\" id=\"R1.1\"><a class=\"rid\" href=\"#R1.1\">R1.1</a><div class=\"rbody\"><span class=\"rlabel\">Pano ölçüsü</span>Kullanıcı vermediyse <strong>mutlaka sor</strong>. Bilinen proje olsa bile ölçü mesajda yoksa sorulmadan HTML'e yazılmaz.</div></li>", "R1.2": "<li class=\"rule r\" id=\"R1.2\"><a class=\"rid\" href=\"#R1.2\">R1.2</a><div class=\"rbody\"><span class=\"rlabel\">Ana kesme: TMŞ mi Pako mu?</span>Modele göre: <strong>KBN 2B</strong>'de ana kesme <strong>TMŞ</strong> (Schneider EasyPact CVS, R5.11). <strong>KBN 1B ve LYM</strong>'de TMŞ kullanılmaz, ana kesme <strong>Pako</strong> (R5.6). Tasarımda yalnız biri vardır; seçilmeyen paftaya eklenmez. Kullanıcıya açıkça söylenir: «Panoda Pako şalter yok, ana kesme TMŞ» veya «Panoda TMŞ yok, ana kesme Pako».</div></li>", "R1.3": "<li class=\"rule r\" id=\"R1.3\"><a class=\"rid\" href=\"#R1.3\">R1.3</a><div class=\"rbody\"><span class=\"rlabel\">Kaçak akım yardımcı kontağı (IOF)</span>Modele göre, sorulmaz: <strong>KBN 2B (PLC'li)</strong> her grup kaçak akımına 1 adet YARDIMCI KONTAK 1NA/1NK A9A26924 IOF <span class=\"chip\" data-code=\"10 10820\">10 10820</span> kesin konur. <strong>KBN 1B ve LYM</strong>'de IOF konmaz.</div></li>", "R1.4": "<li class=\"rule r\" id=\"R1.4\"><a class=\"rid\" href=\"#R1.4\">R1.4</a><div class=\"rbody\">Ölçü alındıktan sonra HTML üst satırı: <code>380 V · 50 Hz · Pano 1000x1200 mm · Tablo gücü …</code> Aynı ölçü notlarda da yazılır: «Pano ölçüsü 1000x1200 mm».</div></li>", "R1.5": "<li class=\"rule r\" id=\"R1.5\"><a class=\"rid\" href=\"#R1.5\">R1.5</a><div class=\"rbody\"><span class=\"rlabel\">Opsiyon listesi</span>Kullanıcı opsiyon listesi verdiğinde her opsiyon tek tek kurallarla eşlenir: eklenen/çıkan malzeme (R4.7, R8.7, R4.1 …), etiket değişikliği (R14) ve <strong>kontak blok sayısı</strong> (R9) opsiyonlara göre yeniden hesaplanır. Listede olup kuralı olmayan opsiyon kullanıcıya sorulur; listede olmayan opsiyon eklenmez.</div></li>", "R1.6": "<li class=\"rule r\" id=\"R1.6\"><a class=\"rid\" href=\"#R1.6\">R1.6</a><div class=\"rbody\"><span class=\"rlabel\">Emniyet rölesi</span>Her panoda sor: «Panoya emniyet rölesi ekleyelim mi?» Evet ise EMNİYET RÖLESİ G9SPN20S OMRON G9SX <span class=\"chip\" data-code=\"10 04538\">10 04538</span> 1 adet (R4.6). Cevapsız ekleme veya atlama.</div></li>", "R2.1": "<li class=\"rule r\" id=\"R2.1\"><a class=\"rid\" href=\"#R2.1\">R2.1</a><div class=\"rbody\">Akım/gerilim verilmezse 380 V, 3 faz, 50 Hz kabul edilir. Çizimde «380 V · 50 Hz» ibaresi üstte durur.</div></li>", "R2.2": "<li class=\"rule r\" id=\"R2.2\"><a class=\"rid\" href=\"#R2.2\">R2.2</a><div class=\"rbody\">Termik/MKŞ ayarı = In.</div></li>", "R2.3": "<li class=\"rule r\" id=\"R2.3\"><a class=\"rid\" href=\"#R2.3\">R2.3</a><div class=\"rbody\">Tablo gücü = yüklerin kW toplamı.</div></li>", "R2.4": "<li class=\"rule r\" id=\"R2.4\"><a class=\"rid\" href=\"#R2.4\">R2.4</a><div class=\"rbody\">Tablo akımı = yükler aynı anda çalışırken hat akımlarının toplamı.</div></li>", "R2.5": "<li class=\"rule r\" id=\"R2.5\"><a class=\"rid\" href=\"#R2.5\">R2.5</a><div class=\"rbody\">Isıtıcı akımı I = P / (√3 × U). 8 kW <span class=\"arrow\">→</span> 12,15 A. 6 kW <span class=\"arrow\">→</span> 9,12 A.</div></li>", "R2.6": "<li class=\"rule r\" id=\"R2.6\"><a class=\"rid\" href=\"#R2.6\">R2.6</a><div class=\"rbody\"><span class=\"rlabel\">Kontaktör</span>Hem AC-3 akımı hem katalog kW değeri motoru karşılayan en küçük model.</div></li>", "R2.7": "<li class=\"rule r\" id=\"R2.7\"><a class=\"rid\" href=\"#R2.7\">R2.7</a><div class=\"rbody\"><span class=\"rlabel\">Termik</span>In, ayar aralığının içinde olan LR2K. Aralık In'i içermiyorsa o model yok sayılır. In iki model arasındaki boşluğa düşerse (ör. 5,5–5,8 A) <strong>bir üst termik</strong> seçilir: LR2K0314 5,80–8,0 A <span class=\"chip\" data-code=\"10 00249\">10 00249</span>.</div></li>", "R2.7a": "<li class=\"rule r\" id=\"R2.7a\"><a class=\"rid\" href=\"#R2.7a\">R2.7a</a><div class=\"rbody\"><span class=\"rlabel\">Termik serisi yetmezse</span>In 16 A'i aşarsa (LR2K en çok 16 A) motor <strong>MKŞ düzenine</strong> geçer. Ör. 11 kW, 23 A <span class=\"arrow\">→</span> GV2ME22 20–25 A <span class=\"chip\" data-code=\"10 18165\">10 18165</span> (R2.8: GV2ME21'de 23 A üst durakta) + LC1D25M7 <span class=\"chip\" data-code=\"10 01329\">10 01329</span> + GVAE11 <span class=\"chip\" data-code=\"10 01365\">10 01365</span>.</div></li>", "R2.8": "<li class=\"rule r\" id=\"R2.8\"><a class=\"rid\" href=\"#R2.8\">R2.8</a><div class=\"rbody\"><span class=\"rlabel\">MKŞ</span>In, ayar aralığının içinde olan GV2ME. In yalnız üst durakta kalıyorsa ve bir üst model de In'i alıyorsa üst model seçilir.</div></li>", "R2.9": "<li class=\"rule r\" id=\"R2.9\"><a class=\"rid\" href=\"#R2.9\">R2.9</a><div class=\"rbody\"><span class=\"rlabel\">Sigorta / kaçak akım / aşırı akım / pako</span>Akımı karşılayan en küçük model.</div></li>", "R3.1": "<li class=\"rule r\" id=\"R3.1\"><a class=\"rid\" href=\"#R3.1\">R3.1</a><div class=\"rbody\">Bir motoru süren düzenlerden yalnız biri seçilir. Üçü bir arada olmaz. MKŞ ile termik aynı motorda durmaz.</div></li>", "R3.2": "<li class=\"rule r\" id=\"R3.2\"><a class=\"rid\" href=\"#R3.2\">R3.2</a><div class=\"rbody\"><span class=\"rlabel\">Düzen A — MKŞ + kontaktör + yardımcı kontak.</span>Her MKŞ için bir YARDIMCI KONTAK GVAE11 MKŞ <span class=\"chip\" data-code=\"10 01365\">10 01365</span>.</div></li>", "R3.3": "<li class=\"rule r\" id=\"R3.3\"><a class=\"rid\" href=\"#R3.3\">R3.3</a><div class=\"rbody\"><span class=\"rlabel\">Düzen B — Termik + kontaktör.</span></div></li>", "R3.4": "<li class=\"rule r\" id=\"R3.4\"><a class=\"rid\" href=\"#R3.4\">R3.4</a><div class=\"rbody\"><span class=\"rlabel\">Düzen C — İnvertör + sigorta.</span></div></li>", "R4.1": "<li class=\"rule r\" id=\"R4.1\"><a class=\"rid\" href=\"#R4.1\">R4.1</a><div class=\"rbody\"><span class=\"rlabel\">Sepet redüktörü (0,37 kW)</span>invertörle sürüldüğünde depo listesine aşağıdakiler yazılır. KBN 1B'de sepet her zaman invertörlüdür. LYM'de invertör istenirse aynısı eklenir (unutma). KBN 2B'de R4.1c/d eklenmez.</div></li>", "R4.1a": "<li class=\"rule r\" id=\"R4.1a\"><a class=\"rid\" href=\"#R4.1a\">R4.1a</a><div class=\"rbody\">İNVERTÖR VFD004EL21W-1 0,4KW <span class=\"chip\" data-code=\"10 16319\">10 16319</span> — 1 adet.</div></li>", "R4.1b": "<li class=\"rule r\" id=\"R4.1b\"><a class=\"rid\" href=\"#R4.1b\">R4.1b</a><div class=\"rbody\">SCHNEIDER SİGORTA A9F74106 1*6 <span class=\"chip\" data-code=\"10 01421\">10 01421</span> — 1 adet.</div></li>", "R4.1c": "<li class=\"rule r\" id=\"R4.1c\"><a class=\"rid\" href=\"#R4.1c\">R4.1c</a><div class=\"rbody\">MİNYATÜR RÖLE RXM4AB1P7 220V <span class=\"chip\" data-code=\"10 00294\">10 00294</span> — 1 adet, R7.4'teki röle setine <strong>ek</strong>. Yalnız KBN 1B ve invertörlü LYM.</div></li>", "R4.1d": "<li class=\"rule r\" id=\"R4.1d\"><a class=\"rid\" href=\"#R4.1d\">R4.1d</a><div class=\"rbody\">RÖLE SOKETİ RXZE2M114M <span class=\"chip\" data-code=\"10 00295\">10 00295</span> — 1 adet, R7.4'teki soketlere <strong>ek</strong>. Yalnız KBN 1B ve invertörlü LYM.</div></li>", "R4.2": "<li class=\"rule r\" id=\"R4.2\"><a class=\"rid\" href=\"#R4.2\">R4.2</a><div class=\"rbody\"><span class=\"rlabel\">Pompa 7,5 kW</span>İNVERTÖR VFD75E43A 7,5KW <span class=\"chip\" data-code=\"10 05803\">10 05803</span>. Giriş 380 V üç faz; ön sigorta 3 kutup: SİGORTA A9F74340 SCHNEİDER 40A <span class=\"chip\" data-code=\"10 16119\">10 16119</span>.</div></li>", "R4.2a": "<li class=\"rule r\" id=\"R4.2a\"><a class=\"rid\" href=\"#R4.2a\">R4.2a</a><div class=\"rbody\"><span class=\"rlabel\">Pompa 2,2 kW invertörlü (KBN 2B)</span>KBN 2B'de yıkama ve durulama pompaları invertörle sürülür (pompa basıncı invertör kontrolü). İnvertör sepet invertörüyle aynı seriden: İNVERTÖR VFD022EL43A 2,2KW (Delta VFD-EL, 380 V üç faz) — STOK KODU YOK (R0.5a). Ön sigorta 3 kutup: SİGORTA A9F74316 SCHNEİDER 16A <span class=\"chip\" data-code=\"10 04000\">10 04000</span>. MKŞ ve termik eklenmez.</div></li>", "R4.3": "<li class=\"rule r\" id=\"R4.3\"><a class=\"rid\" href=\"#R4.3\">R4.3</a><div class=\"rbody\"><span class=\"rlabel\">Isıtıcı — KBN 1B</span>yalnız kontaktör: KONTAKTÖR LC1K1610M7 220V <span class=\"chip\" data-code=\"10 01332\">10 01332</span> (8 kW için 16 A). Termik, MKŞ ve ayrı sigorta eklenmez; ısıtıcı hattının koruması girişteki tek büyük sigortadan (aşırı akım koruma, R5.5) gelir.</div></li>", "R4.4": "<li class=\"rule r\" id=\"R4.4\"><a class=\"rid\" href=\"#R4.4\">R4.4</a><div class=\"rbody\"><span class=\"rlabel\">Isıtıcı — KBN 2B</span>kontaktör + 3P sigorta. Termik ve MKŞ eklenmez. 8 kW (12,15 A) ve 6 kW (9,12 A) için: KONTAKTÖR LC1K1610M7 220V <span class=\"chip\" data-code=\"10 01332\">10 01332</span> + SİGORTA A9F74316 SCHNEİDER 16A <span class=\"chip\" data-code=\"10 04000\">10 04000</span>. LC1K09 (9 A) 6 kW ısıtıcının 9,12 A'ini karşılamaz. A9F74306 (6 A) ikisini de karşılamaz.</div></li>", "R4.5": "<li class=\"rule r\" id=\"R4.5\"><a class=\"rid\" href=\"#R4.5\">R4.5</a><div class=\"rbody\"><span class=\"rlabel\">Sensörler</span>sensör, termokupl ve el koruma sensörüne kontaktör, termik, MKŞ eklenmez.</div></li>", "R4.6": "<li class=\"rule r\" id=\"R4.6\"><a class=\"rid\" href=\"#R4.6\">R4.6</a><div class=\"rbody\"><span class=\"rlabel\">Kapak kapalı sensörü</span>kuru kontaktır, 24 V veya 220 V beslemesi yoktur. Emniyet rölesi istenirse (R1.6; KSYSTEM siparişlerinde istendi) 1 adet EMNİYET RÖLESİ G9SPN20S OMRON G9SX <span class=\"chip\" data-code=\"10 04538\">10 04538</span>; kapak kapalı switchleri ve acil stop bu röleye bağlanır. G9SB2002 bu düzende kullanılmaz.</div></li>", "R4.7": "<li class=\"rule r\" id=\"R4.7\"><a class=\"rid\" href=\"#R4.7\">R4.7</a><div class=\"rbody\"><span class=\"rlabel\">Yağ sıyırıcı (opsiyon)</span>Opsiyon varsa depo listesine yazılır. Etiket kısmı R14.5.</div></li>", "R4.7a": "<li class=\"rule r\" id=\"R4.7a\"><a class=\"rid\" href=\"#R4.7a\">R4.7a</a><div class=\"rbody\"><span class=\"rlabel\">KBN 1B ve LYM: termik + kontaktör</span>TERMIK RÖLESİ LR2K0305 0,54-0,8A <span class=\"chip\" data-code=\"10 00243\">10 00243</span> + KONTAKTÖR LC1K0610M7 220V <span class=\"chip\" data-code=\"10 02314\">10 02314</span>.</div></li>", "R4.7b": "<li class=\"rule r\" id=\"R4.7b\"><a class=\"rid\" href=\"#R4.7b\">R4.7b</a><div class=\"rbody\"><span class=\"rlabel\">KBN 2B: MKŞ + kontaktör</span>MOTOR KORUMA ŞALTERİ GV2ME04 0,40-0,63A <span class=\"chip\" data-code=\"10 01368\">10 01368</span> + KONTAKTÖR LC1K0610M7 220V <span class=\"chip\" data-code=\"10 02314\">10 02314</span> + YARDIMCI KONTAK GVAE11 MKŞ <span class=\"chip\" data-code=\"10 01365\">10 01365</span>. (KBN 1B/LYM termiği LR2K0305 aynı kalır.) Etikete buton/lamba konmaz; yağ sıyırıcı <strong>ekrandan</strong> kumanda edilir.</div></li>", "R4.7c": "<li class=\"rule r\" id=\"R4.7c\"><a class=\"rid\" href=\"#R4.7c\">R4.7c</a><div class=\"rbody\"><span class=\"rlabel\">Etiket kalemleri (yalnız KBN 1B ve LYM)</span>BUTON MANDAL B100S20 <span class=\"chip\" data-code=\"10 00262\">10 00262</span> 1 adet + SİNYAL LAMBASI S14B BEYAZ 220V <span class=\"chip\" data-code=\"10 00279\">10 00279</span> 1 adet + KONTAK BLOK NO B1 <span class=\"chip\" data-code=\"10 00267\">10 00267</span> 1 adet.</div></li>", "R4.8": "<li class=\"rule r\" id=\"R4.8\"><a class=\"rid\" href=\"#R4.8\">R4.8</a><div class=\"rbody\"><span class=\"rlabel\">Saha satırı üç bölüm (KBN 2B)</span>Saha kalemleri paftada üç satırda yazılır: <strong>Sensörler</strong>, <strong>Valfler</strong>, <strong>Switchboxlar</strong>. Hiçbirine kontaktör, termik, MKŞ eklenmez; stok kodu verilmedi.</div></li>", "R4.9": "<li class=\"rule r\" id=\"R4.9\"><a class=\"rid\" href=\"#R4.9\">R4.9</a><div class=\"rbody\"><span class=\"rlabel\">Tahliye pistonu (KBN 2B)</span>Her tank için 1 adet tahliye pistonu valfi 5/3 (yıkama tankı, durulama tankı …) yazılır. Her pistonun açık ve kapalı sensörü vardır (+24VDC, 2 giriş); PLC çıkışı pistonu aç / kapa (2 çıkış).</div></li>", "R4.10": "<li class=\"rule r\" id=\"R4.10\"><a class=\"rid\" href=\"#R4.10\">R4.10</a><div class=\"rbody\"><span class=\"rlabel\">Otomatik dolum (EX108)</span>Opsiyon varsa tank sayısı kaç olursa olsun <strong>tank başına</strong>: 1 adet 3/2 valf (aktüatörlü dolum vanası), 1 adet switchbox (vana açık / kapalı bilgisi, 2 giriş) ve 1 adet üst seviye sensörü. PLC çıkışı vana başına 1. Opsiyon yoksa tank başına yalnız alt seviye sensörü vardır.</div></li>", "R5.0": "<li class=\"rule r\" id=\"R5.0\"><a class=\"rid\" href=\"#R5.0\">R5.0</a><div class=\"rbody\"><span class=\"rlabel\">Modele göre seçim</span>aşağıdaki tabloya göre.</div></li>", "R5.1": "<li class=\"rule r\" id=\"R5.1\"><a class=\"rid\" href=\"#R5.1\">R5.1</a><div class=\"rbody\"><span class=\"rlabel\">Güç kaynağı</span>1 adet, R5.0'a göre: KBN 1B GÜÇ KAYNAĞI MDR 100/24 <span class=\"chip\" data-code=\"10 02772\">10 02772</span>; KBN 2B GÜÇ KAYNAĞI LRS 350/24 24VDC 14,6AMP <span class=\"chip\" data-code=\"10 04903\">10 04903</span>; LYM GÜÇ KAYNAĞI MDR 20/24 <span class=\"chip\" data-code=\"10 02491\">10 02491</span>.</div></li>", "R5.2": "<li class=\"rule r\" id=\"R5.2\"><a class=\"rid\" href=\"#R5.2\">R5.2</a><div class=\"rbody\">FAZ KORUMA RÖLESİ MKS-03 <span class=\"chip\" data-code=\"10 00258\">10 00258</span> — 1 adet. KBN 1B, KBN 2B ve LYM'de zorunlu.</div></li>", "R5.3": "<li class=\"rule r\" id=\"R5.3\"><a class=\"rid\" href=\"#R5.3\">R5.3</a><div class=\"rbody\">Kumanda sigortası SİGORTA A9F74103 1*3 <span class=\"chip\" data-code=\"10 00302\">10 00302</span> — 1 adet.</div></li>", "R5.4": "<li class=\"rule r\" id=\"R5.4\"><a class=\"rid\" href=\"#R5.4\">R5.4</a><div class=\"rbody\"><span class=\"rlabel\">Kaçak akım</span>KBN 1B ve LYM: tüm pano için 1 adet, tablo akımını karşılayan en küçük model (tablo 6.5). KBN 2B (PLC'li): <strong>grup başına</strong> 1 adet (ör. yıkama, durulama, ısıtıcı grupları), her biri o grubun akımını karşılayan en küçük model; gruplar paftadan net değilse sor. 100 A üstü <span class=\"arrow\">→</span> yetmediğini yaz.</div></li>", "R5.5": "<li class=\"rule r\" id=\"R5.5\"><a class=\"rid\" href=\"#R5.5\">R5.5</a><div class=\"rbody\"><span class=\"rlabel\">Aşırı akım koruma</span>KBN 1B ve LYM: tüm pano için 1 adet, aynı seçim (tablo 6.6). 63 A üstü <span class=\"arrow\">→</span> yetmediğini yaz. <strong>KBN 2B'de yok</strong>; koruma TMŞ + grup kaçak akımlarıdır.</div></li>", "R5.6": "<li class=\"rule r\" id=\"R5.6\"><a class=\"rid\" href=\"#R5.6\">R5.6</a><div class=\"rbody\"><span class=\"rlabel\">Pako şalter</span>KBN 1B ve LYM: tüm pano için 1 adet, tablo akımına göre en küçük model (tablo 6.7). 63 A üstü <span class=\"arrow\">→</span> yetmediğini yaz. KBN 2B'de pako yok (R1.2).</div></li>", "R5.7": "<li class=\"rule r\" id=\"R5.7\"><a class=\"rid\" href=\"#R5.7\">R5.7</a><div class=\"rbody\"><span class=\"rlabel\">Pano lambası</span>PANO LAMBASI CT-2467 <span class=\"chip\" data-code=\"10 03253\">10 03253</span> 1 adet. Sigortası SCHNEIDER SİGORTA A9F74106 1*6 <span class=\"chip\" data-code=\"10 01421\">10 01421</span>. Anahtarı SWITCH BS1022 ANI HARK.1NA+1NK <span class=\"chip\" data-code=\"10 16235\">10 16235</span>.</div></li>", "R5.8": "<li class=\"rule r\" id=\"R5.8\"><a class=\"rid\" href=\"#R5.8\">R5.8</a><div class=\"rbody\"><span class=\"rlabel\">Priz</span>PRİZ RAYA MONTAJ TOPRAKLI EPREU2G <span class=\"chip\" data-code=\"10 03313\">10 03313</span>, 1 adet.</div></li>", "R5.9": "<li class=\"rule r\" id=\"R5.9\"><a class=\"rid\" href=\"#R5.9\">R5.9</a><div class=\"rbody\"><span class=\"rlabel\">LRS 350/24 sigortaları</span>LRS <span class=\"chip\" data-code=\"10 04903\">10 04903</span> kullanıldığında: giriş SCHNEIDER SİGORTA A9F74106 1*6 <span class=\"chip\" data-code=\"10 01421\">10 01421</span>, çıkış SIGORTA A9F74110 1*10 <span class=\"chip\" data-code=\"10 01422\">10 01422</span>.</div></li>", "R5.10": "<li class=\"rule r\" id=\"R5.10\"><a class=\"rid\" href=\"#R5.10\">R5.10</a><div class=\"rbody\"><span class=\"rlabel\">Bara</span>KBN 1B ve KBN 2B: motor grubu için 1 adet BARA GWEST 4×7 mm <span class=\"chip\" data-code=\"10 03578\">10 03578</span>. KBN 2B ayrıca 1 adet BARA GWEST 2X7 MM <span class=\"chip\" data-code=\"10 15962\">10 15962</span>. LYM'de bara yok.</div></li>", "R5.11": "<li class=\"rule r\" id=\"R5.11\"><a class=\"rid\" href=\"#R5.11\">R5.11</a><div class=\"rbody\"><span class=\"rlabel\">TMŞ (yalnız KBN 2B)</span>Schneider EasyPact CVS F (36 kA), 3P3D, TM-D termik-manyetik. Tablo akımını karşılayan en küçük In seçilir (tablo 6.14). Termik ayarı Ir = 0,7–1 × In; Ir tablo akımına ayarlanır. 250 A üstü <span class=\"arrow\">→</span> uydurma, yetmediğini yaz.</div></li>", "R5.12": "<li class=\"rule r\" id=\"R5.12\"><a class=\"rid\" href=\"#R5.12\">R5.12</a><div class=\"rbody\"><span class=\"rlabel\">TMŞ döner kolu</span>Her TMŞ'ye 1 adet LV429338 uzatılmış döner kol (siyah, IP55): kesici pano içinde, kol kapakta. CVS 100/160/250'nin hepsine aynı kol uyar.</div></li>", "R5.13": "<li class=\"rule r\" id=\"R5.13\"><a class=\"rid\" href=\"#R5.13\">R5.13</a><div class=\"rbody\"><span class=\"rlabel\">LYM röle seti</span>MİNYATÜR RÖLE RXM4AB1BD 24V <span class=\"chip\" data-code=\"10 01398\">10 01398</span> 1 adet, MİNYATÜR RÖLE RXM4AB1P7 220V <span class=\"chip\" data-code=\"10 00294\">10 00294</span> 2 adet, RÖLE SOKETİ RXZE2M114M <span class=\"chip\" data-code=\"10 00295\">10 00295</span> 3 adet. Sepet invertörü varsa +1 RXM4AB1P7 ve +1 soket (R4.1c/d) <span class=\"arrow\">→</span> en çok 4 soket. Sensör sayısı röle sayısını artırmaz.</div></li>", "R7.1": "<li class=\"rule r\" id=\"R7.1\"><a class=\"rid\" href=\"#R7.1\">R7.1</a><div class=\"rbody\">Standart 710x710 KBN 1B panosu kullanılır.</div></li>", "R7.2": "<li class=\"rule r\" id=\"R7.2\"><a class=\"rid\" href=\"#R7.2\">R7.2</a><div class=\"rbody\">Sepet redüktörü invertörle döner (R4.1). Sepet durdurma sensörü +24VDC. İnvertör parametreleri ayarlanır.</div></li>", "R7.3": "<li class=\"rule r\" id=\"R7.3\"><a class=\"rid\" href=\"#R7.3\">R7.3</a><div class=\"rbody\">Pano etiketi Almanca ve İngilizce. Doküman koyma kısmı ters olmaz. Pano kapağına ve güç kaynağına topraklama hattı çekilir.</div></li>", "R7.4": "<li class=\"rule r\" id=\"R7.4\"><a class=\"rid\" href=\"#R7.4\">R7.4</a><div class=\"rbody\"><span class=\"rlabel\">KBN 1B röle seti</span>RXM4AB1BD 24V <span class=\"chip\" data-code=\"10 01398\">10 01398</span> 1 adet, RXM4AB1P7 220V <span class=\"chip\" data-code=\"10 00294\">10 00294</span> 2 adet, RXZE2M114M soket <span class=\"chip\" data-code=\"10 00295\">10 00295</span> 3 adet. Sepet invertörü için +1 RXM4AB1P7 ve +1 soket ayrıca eklenir (R4.1c/d) <span class=\"arrow\">→</span> KBN 1B toplamı 3 adet RXM4AB1P7, 4 adet soket. Sensör sayısı röle sayısını artırmaz.</div></li>", "R7.4a": "<li class=\"rule r\" id=\"R7.4a\"><a class=\"rid\" href=\"#R7.4a\">R7.4a</a><div class=\"rbody\"><span class=\"rlabel\">Döner nozzle (KBN 1B opsiyonu)</span>varsa röle seti 6 sokete çıkar: +2 RXZE2M114M <span class=\"chip\" data-code=\"10 00295\">10 00295</span> ve +2 röle (tipi Q17).</div></li>", "R7.5": "<li class=\"rule r\" id=\"R7.5\"><a class=\"rid\" href=\"#R7.5\">R7.5</a><div class=\"rbody\"><span class=\"rlabel\">Ön yüz, üstte</span>ORDEL OC990-9/0240 <span class=\"chip\" data-code=\"10 00229\">10 00229</span>.</div></li>", "R7.6": "<li class=\"rule r\" id=\"R7.6\"><a class=\"rid\" href=\"#R7.6\">R7.6</a><div class=\"rbody\"><span class=\"rlabel\">ORDEL varsa</span>START ve STOP butonu konulmaz; etikette ve depoda yazılmaz, kontakları da yazılmaz. Yerine beyaz lambalar: YIKAMA ve ISITICI — SİNYAL LAMBASI S14B BEYAZ 220V <span class=\"chip\" data-code=\"10 00279\">10 00279</span>, 2 adet.</div></li>", "R7.7": "<li class=\"rule r\" id=\"R7.7\"><a class=\"rid\" href=\"#R7.7\">R7.7</a><div class=\"rbody\">RESET mavi = B100DM <span class=\"chip\" data-code=\"10 00272\">10 00272</span>. SEPET TEST = B100DB <span class=\"chip\" data-code=\"10 00270\">10 00270</span>. ACİL STOP = B200EE <span class=\"chip\" data-code=\"10 03445\">10 03445</span>, 1 adet.</div></li>", "R7.8": "<li class=\"rule r\" id=\"R7.8\"><a class=\"rid\" href=\"#R7.8\">R7.8</a><div class=\"rbody\"><span class=\"rlabel\">Uyarı lambası</span>3 adet SİNYAL LAMBASI S14K KIRMIZI 220V <span class=\"chip\" data-code=\"10 00278\">10 00278</span>. Etiket adları: düşük su seviyesi, pompa arızası, redüktör arızası.</div></li>", "R7.9": "<li class=\"rule r\" id=\"R7.9\"><a class=\"rid\" href=\"#R7.9\">R7.9</a><div class=\"rbody\"><span class=\"rlabel\">Çift el butonu</span>iki kapak aç (yeşil B100DY <span class=\"chip\" data-code=\"10 00273\">10 00273</span>) sola, iki kapak kapat (kırmızı B100DK <span class=\"chip\" data-code=\"10 00271\">10 00271</span>) sağa. Aynı taraftaki iki buton arasında yukarıdan aşağı en az 25–30 cm. Aç ile kapat arası yatay mesafe bu ölçü değildir. Etiket dar kalır, dikey ölçü için uzar.</div></li>", "R8.1": "<li class=\"rule r\" id=\"R8.1\"><a class=\"rid\" href=\"#R8.1\">R8.1</a><div class=\"rbody\"><span class=\"rlabel\">Etiket</span>üstte OMRON NB7W-TW01B <span class=\"chip\" data-code=\"10 16496\">10 16496</span>. Sepet test butonu yoktur; B100DB <span class=\"chip\" data-code=\"10 00270\">10 00270</span> etikete ve depoya yazılmaz.</div></li>", "R8.2": "<li class=\"rule r\" id=\"R8.2\"><a class=\"rid\" href=\"#R8.2\">R8.2</a><div class=\"rbody\">Ortada SIFIRLA mavi = B100DM <span class=\"chip\" data-code=\"10 00272\">10 00272</span>. Solunda START, sağında STOP. START ve STOP kapak aç/kapat butonlarından <strong>ayrı</strong> butonlardır, aynı model: START yeşil B100DY <span class=\"chip\" data-code=\"10 00273\">10 00273</span>, STOP kırmızı B100DK <span class=\"chip\" data-code=\"10 00271\">10 00271</span>. Etikette toplam 3 yeşil (START + 2 kapak aç) ve 3 kırmızı (STOP + 2 kapak kapat).</div></li>", "R8.3": "<li class=\"rule r\" id=\"R8.3\"><a class=\"rid\" href=\"#R8.3\">R8.3</a><div class=\"rbody\"><span class=\"rlabel\">Çift el</span>KBN 1B ile aynı (R7.9).</div></li>", "R8.4": "<li class=\"rule r\" id=\"R8.4\"><a class=\"rid\" href=\"#R8.4\">R8.4</a><div class=\"rbody\"><span class=\"rlabel\">PLC I/O</span>CP2E-N60 dijital giriş 0.0–0.11, 1.0–1.11, 2.0–2.11 (36 giriş); çıkış 100.0–100.7, 101.0–101.7, 102.0–102.7 (24 çıkış). Dijital ek modül <strong>yalnız</strong> giriş 36'yı veya çıkış 24'ü aşarsa eklenir (R8.4a); aşmıyorsa PLC listesi CPU + TS002 + ADB21 + NB7W'dir ve gereksiz YEDEK uç bırakılmaz. CP1W-20EDT1 eklenirse giriş 3.0–3.11, çıkış 103.0–103.7. Boş uç YEDEK. TS002 ve ADB21 bu dijital uçları kullanmaz.</div></li>", "R8.4a": "<li class=\"rule r\" id=\"R8.4a\"><a class=\"rid\" href=\"#R8.4a\">R8.4a</a><div class=\"rbody\"><span class=\"rlabel\">Ek modül seçimi</span>CPU kapasitesini (36 giriş / 24 çıkış) aşan I/O'yu karşılayan en küçük ek modül seçilir. Fazla ≤ 12 giriş ve ≤ 8 çıkış <span class=\"arrow\">→</span> PLC EK MODÜL OMRON CP1W20EDT1 <span class=\"chip\" data-code=\"10 18528\">10 18528</span> (12DI/8DO; giriş 3.0–3.11, çıkış 103.0–103.7). Fazla ≤ 24 giriş ve ≤ 16 çıkış <span class=\"arrow\">→</span> CP1W-40EDT1 (24DI/16DO; giriş 3.0–3.11, 4.0–4.11, çıkış 103.0–103.7, 104.0–104.7). Daha fazlası <span class=\"arrow\">→</span> 20EDT1 + 40EDT1 (en çok 72 giriş / 48 çıkış); aşarsa uydurma, yetmediğini yaz. Çıkışlar son modülün son ucuyla biter (R8.5).</div></li>", "R8.5": "<li class=\"rule r\" id=\"R8.5\"><a class=\"rid\" href=\"#R8.5\">R8.5</a><div class=\"rbody\"><span class=\"rlabel\">Çıkış rölesi</span>YAPRAK ROLE KONTAĞI WEİDMÜLLER TRS 24VDC 1CO <span class=\"chip\" data-code=\"10 02146\">10 02146</span>, adet R numarası kadar. Çıkışlar son modülün son ucuyla biter (yalnız CPU'da 102.7, 20EDT1 ile 103.7); boş giriş satırına röle yazılmaz. Safety PLC röle sütunu bir sonraki numaradan devam eder ve SO6 ile biter; çıkışı boş safety satırına röle yazılmaz.</div></li>", "R8.6": "<li class=\"rule r\" id=\"R8.6\"><a class=\"rid\" href=\"#R8.6\">R8.6</a><div class=\"rbody\"><span class=\"rlabel\">Röle köprüsü</span>WEIDMÜLLER TCC 6.4/51 OR (24 diş) <span class=\"chip\" data-code=\"10 13016\">10 13016</span>, her 24 röle için 1 adet. Safety röleleri (R8.7) bu sayıma dahildir.</div></li>", "R8.7": "<li class=\"rule r\" id=\"R8.7\"><a class=\"rid\" href=\"#R8.7\">R8.7</a><div class=\"rbody\"><span class=\"rlabel\">Safety PLC varsa</span>depo listesine ayrıca 6 adet YAPRAK ROLE KONTAĞI WEİDMÜLLER TRS 24VDC 1CO <span class=\"chip\" data-code=\"10 02146\">10 02146</span> eklenir (SO1–SO6). Safety PLC yoksa bu 6 röle eklenmez.</div></li>", "R9.1": "<li class=\"rule r\" id=\"R9.1\"><a class=\"rid\" href=\"#R9.1\">R9.1</a><div class=\"rbody\">Acil stop: 2 NC.</div></li>", "R9.2": "<li class=\"rule r\" id=\"R9.2\"><a class=\"rid\" href=\"#R9.2\">R9.2</a><div class=\"rbody\">Reset: 1 NO + 1 NC.</div></li>", "R9.3": "<li class=\"rule r\" id=\"R9.3\"><a class=\"rid\" href=\"#R9.3\">R9.3</a><div class=\"rbody\">Start ve stop (ORDEL yoksa veya KBN 2B): her biri 1 NO + 1 NC. ORDEL varsa start/stop ve kontakları yazılmaz.</div></li>", "R9.3a": "<li class=\"rule r\" id=\"R9.3a\"><a class=\"rid\" href=\"#R9.3a\">R9.3a</a><div class=\"rbody\"><span class=\"rlabel\">LYM WASHING ikiz buton</span>(B102K20KY <span class=\"chip\" data-code=\"10 00266\">10 00266</span>): 1 NO + 1 NC. <strong>İnterlock kilit</strong> opsiyonu varsa 2 NO + 2 NC.</div></li>", "R9.4": "<li class=\"rule r\" id=\"R9.4\"><a class=\"rid\" href=\"#R9.4\">R9.4</a><div class=\"rbody\">Her kapak aç ve her kapak kapat butonu: 1 NO + 1 NC. KBN 2B'de START ve STOP bunlara ek ayrı butonlardır (R8.2, R9.3).</div></li>", "R9.5": "<li class=\"rule r\" id=\"R9.5\"><a class=\"rid\" href=\"#R9.5\">R9.5</a><div class=\"rbody\">Sepet test (KBN 1B) ve LYM TEST: 1 NO.</div></li>", "R9.5a": "<li class=\"rule r\" id=\"R9.5a\"><a class=\"rid\" href=\"#R9.5a\">R9.5a</a><div class=\"rbody\"><span class=\"rlabel\">LYM HEATER</span>ışıklı mandal buton (B100SL20Y <span class=\"chip\" data-code=\"10 00263\">10 00263</span>): 1 NO.</div></li>", "R9.6a": "<li class=\"rule r\" id=\"R9.6a\"><a class=\"rid\" href=\"#R9.6a\">R9.6a</a><div class=\"rbody\">Yağ sıyırıcı mandal butonu (B100S20): 1 NO.</div></li>", "R9.7": "<li class=\"rule r\" id=\"R9.7\"><a class=\"rid\" href=\"#R9.7\">R9.7</a><div class=\"rbody\">Depo listesine NO (B1 <span class=\"chip\" data-code=\"10 00267\">10 00267</span>) ve NC (B2 <span class=\"chip\" data-code=\"10 00268\">10 00268</span>) toplam adedi yazılır. Sayım opsiyon listesine göre yapılır (R1.5). Kontak bloklar butona takılı gelmez; her buton için ayrıca yazılır.</div></li>", "R10.1": "<li class=\"rule r\" id=\"R10.1\"><a class=\"rid\" href=\"#R10.1\">R10.1</a><div class=\"rbody\">Depo listesinde Foto sütunu vardır. Kaynak <code>photos/</code>; dosya adı stok kodudur, format JPG.</div></li>", "R10.2": "<li class=\"rule r\" id=\"R10.2\"><a class=\"rid\" href=\"#R10.2\">R10.2</a><div class=\"rbody\">Ölçü ve kadraj değiştirilmez. Arka plan temizlenir, saydam yapılır. Tabloda <code>photos/temiz/</code> altındaki saydam PNG kullanılır. Kaynak PNG'ye dokunulmaz.</div></li>", "R10.3": "<li class=\"rule r\" id=\"R10.3\"><a class=\"rid\" href=\"#R10.3\">R10.3</a><div class=\"rbody\">Fotoğraflar HTML'e gömülür: <code>img</code> asla <code>../photos/temiz/...</code> gibi bir dosya yoluna bağlanmaz. HTML başka yere kopyalansa da foto durur.</div></li>", "R10.4": "<li class=\"rule r\" id=\"R10.4\"><a class=\"rid\" href=\"#R10.4\">R10.4</a><div class=\"rbody\">Hücre 68×68 px; uzun kenar 136 px, oran bozulmaz, saydamlık kalır. WebP kalite 75 ile <code>data:image/webp;base64,...</code>.</div></li>", "R10.5": "<li class=\"rule r\" id=\"R10.5\"><a class=\"rid\" href=\"#R10.5\">R10.5</a><div class=\"rbody\">Fotoğrafı olmayan satır boş kalır. Kökte veya başka klasördeki kopya da aynı şekilde gömülür.</div></li>", "R10.6": "<li class=\"rule r\" id=\"R10.6\"><a class=\"rid\" href=\"#R10.6\">R10.6</a><div class=\"rbody\"><span class=\"rlabel\">Eksiksiz liste</span>pano içi (DIN ray), kapak/etiket (buton, lamba, kontak blok, ekran, ORDEL), bara, klemens, röle, soket, köprü ve opsiyon malzemelerinin tamamı depo listesindedir. Liste bitince pafta ve etiketle karşılaştırılır; eksik kalem varsa eklenir.</div></li>", "R11.1": "<li class=\"rule r\" id=\"R11.1\"><a class=\"rid\" href=\"#R11.1\">R11.1</a><div class=\"rbody\">Pano içi 2D dizilim istendiğinde ayrı HTML açılmaz; proje HTML'inin en altına <code>&lt;section class=&quot;pano-layout&quot;&gt;</code> eklenir/güncellenir. Satır içeriğini kullanıcı söyler; çerçeve ve ölçü kuralları sabittir.</div></li>", "R11.2": "<li class=\"rule r\" id=\"R11.2\"><a class=\"rid\" href=\"#R11.2\">R11.2</a><div class=\"rbody\">Dış kare = pano ölçüsü. İç kare = tava montaj alanı (tipik 630×630 mm; farklıysa paftada belirtilir).</div></li>", "R11.2a": "<li class=\"rule r\" id=\"R11.2a\"><a class=\"rid\" href=\"#R11.2a\">R11.2a</a><div class=\"rbody\">900×1200 panoda tava 800×1100 mm kabul edilir (kenarlardan 50 mm); TMŞ ve LRS 350/24 montaj plakasına vidalanır, ray dışıdır (R11.13a). Satırlar genişliğe göre otomatik bölünür; bir satıra sığmayan kalem bir sonraki satıra geçer.</div></li>", "R11.3": "<li class=\"rule r\" id=\"R11.3\"><a class=\"rid\" href=\"#R11.3\">R11.3</a><div class=\"rbody\">40 mm kablo kanalları: üstte (tava üst kenarına sıfır), solda ve sağda (tava alt kenarına kadar), her DIN satırı arasında, altta (tava alt kenarına sıfır).</div></li>", "R11.4": "<li class=\"rule r\" id=\"R11.4\"><a class=\"rid\" href=\"#R11.4\">R11.4</a><div class=\"rbody\">İç alan genişliği = tava − 2×40 mm. Dikey: üst kanal + satır bantları + ara kanallar + alt kanal = tava yüksekliği.</div></li>", "R11.5": "<li class=\"rule r\" id=\"R11.5\"><a class=\"rid\" href=\"#R11.5\">R11.5</a><div class=\"rbody\">Her satırda DIN 35 rayı sol kanaldan sağ kanala tam genişlikte çizilir.</div></li>", "R11.6": "<li class=\"rule r\" id=\"R11.6\"><a class=\"rid\" href=\"#R11.6\">R11.6</a><div class=\"rbody\">Malzemeler yalnız ray üzerinde; katalog genişlik×yükseklik kutuları ray dışına taşmaz. Sığmazsa yalnız aralık daraltılır, kutu küçültülmez.</div></li>", "R11.7": "<li class=\"rule r\" id=\"R11.7\"><a class=\"rid\" href=\"#R11.7\">R11.7</a><div class=\"rbody\">Yan yana kutular arası tipik 2 mm; motor/termik grupları arasında biraz daha geniş olabilir.</div></li>", "R11.8": "<li class=\"rule r\" id=\"R11.8\"><a class=\"rid\" href=\"#R11.8\">R11.8</a><div class=\"rbody\">Satır bandı: en üstte ve en altta kalan parça ile komşu 40 mm kanal arasında en az 20 mm boşluk kalır.</div></li>", "R11.9": "<li class=\"rule r\" id=\"R11.9\"><a class=\"rid\" href=\"#R11.9\">R11.9</a><div class=\"rbody\"><span class=\"rlabel\">Satır 1</span>(besleme/koruma): kullanıcının verdiği sıra. İnvertör varsa satırdaki parçaların ve rayın Y merkezi invertör merkezine hizalı.</div></li>", "R11.10": "<li class=\"rule r\" id=\"R11.10\"><a class=\"rid\" href=\"#R11.10\">R11.10</a><div class=\"rbody\"><span class=\"rlabel\">Motor satırı</span>termik + kontaktör (LC1K 45×58, LR2K 45×58, direkt montaj birleşim 94 mm, 22 mm bindirme). Kontaktör üstte, termik altta. Ray merkezi kontaktör merkezinde. Termik alt hizasından 20 mm sonra kanal başlar.</div></li>", "R11.11": "<li class=\"rule r\" id=\"R11.11\"><a class=\"rid\" href=\"#R11.11\">R11.11</a><div class=\"rbody\"><span class=\"rlabel\">Isıtıcı</span>KBN 1B: yalnız LC1K1610M7 çizilir. KBN 2B: kontaktör + 3P sigorta. Termik/MKŞ çizilmez.</div></li>", "R11.12": "<li class=\"rule r\" id=\"R11.12\"><a class=\"rid\" href=\"#R11.12\">R11.12</a><div class=\"rbody\"><span class=\"rlabel\">Klemens satırı</span>solda birkaç geniş güç klemensi, her motor 4, her ısıtıcı 3 (ısıtıcı hatvesi daha geniş), kumanda hatveleri; toplam ray içinde.</div></li>", "R11.13": "<li class=\"rule r\" id=\"R11.13\"><a class=\"rid\" href=\"#R11.13\">R11.13</a><div class=\"rbody\"><span class=\"rlabel\">Ray dışı</span>ön yüz/kapı elemanları (ORDEL, acil stop, buton, lamba, priz, HMI vb.) DIN rayına zorla sığdırılmaz; aynı SVG'de not veya ayrı gösterim.</div></li>", "R11.13a": "<li class=\"rule r\" id=\"R11.13a\"><a class=\"rid\" href=\"#R11.13a\">R11.13a</a><div class=\"rbody\"><span class=\"rlabel\">TMŞ</span>DIN rayına değil montaj plakasına vidalanır; 3P gövde 105×161 mm. Satır 1'de en solda durur, satır yüksekliği buna göre hesaplanır (R11.8). Döner kol mili kapağa çıkar.</div></li>", "R11.14": "<li class=\"rule r\" id=\"R11.14\"><a class=\"rid\" href=\"#R11.14\">R11.14</a><div class=\"rbody\">Ölçek 1 mm = 1,55 px. Kutuda stok adı ve kodu yazılır.</div></li>", "R11.15": "<li class=\"rule r\" id=\"R11.15\"><a class=\"rid\" href=\"#R11.15\">R11.15</a><div class=\"rbody\">BARA GWEST 4×7 mm <span class=\"chip\" data-code=\"10 03578\">10 03578</span>: ray üstü blok genişliği 10 mm.</div></li>", "R11.16": "<li class=\"rule r\" id=\"R11.16\"><a class=\"rid\" href=\"#R11.16\">R11.16</a><div class=\"rbody\"><span class=\"rlabel\">Renkler</span>koruma mavi, kontaktör mavi, termik kırmızımsı, röle yeşil, invertör koyu zemin, ısıtıcı kontaktörü turuncu, klemens türüne göre yeşil/mavi/turuncu/mor, ray çelik grisi, kanal gri.</div></li>", "R12.1": "<li class=\"rule r\" id=\"R12.1\"><a class=\"rid\" href=\"#R12.1\">R12.1</a><div class=\"rbody\">Makine sütununda ve malzeme satırında sembolün altındaki yazılar ortalıdır; sembol yazının üstünde ortada durur.</div></li>", "R12.2": "<li class=\"rule r\" id=\"R12.2\"><a class=\"rid\" href=\"#R12.2\">R12.2</a><div class=\"rbody\">Başlık satırındaki bütün yazılar ortalıdır.</div></li>", "R12.3": "<li class=\"rule r\" id=\"R12.3\"><a class=\"rid\" href=\"#R12.3\">R12.3</a><div class=\"rbody\">Sayı sütununda ondalık hane sütundaki en uzun değere göre eşitlenir (0,46 varken 1,10; 16 <span class=\"arrow\">→</span> 16,00). Birim her satırda aynı yerde durur. Eşitlenen sayı sütunu ortalıdır.</div></li>", "R12.4": "<li class=\"rule r\" id=\"R12.4\"><a class=\"rid\" href=\"#R12.4\">R12.4</a><div class=\"rbody\">Genişliği değişen sütunlar sola dayalıdır.</div></li>", "R14.1": "<li class=\"rule r\" id=\"R14.1\"><a class=\"rid\" href=\"#R14.1\">R14.1</a><div class=\"rbody\"><span class=\"rlabel\">Dil</span>KBN 1B / KBN 2B etiketi Almanca ve İngilizce. LYM etiketi İngilizce (R14.8).</div></li>", "R14.2": "<li class=\"rule r\" id=\"R14.2\"><a class=\"rid\" href=\"#R14.2\">R14.2</a><div class=\"rbody\"><span class=\"rlabel\">Üst</span>KBN 1B'de ORDEL OC990-9/0240 <span class=\"chip\" data-code=\"10 00229\">10 00229</span>, KBN 2B'de OMRON NB7W-TW01B <span class=\"chip\" data-code=\"10 16496\">10 16496</span>, LYM'de logo altında ACİL STOP.</div></li>", "R14.3": "<li class=\"rule r\" id=\"R14.3\"><a class=\"rid\" href=\"#R14.3\">R14.3</a><div class=\"rbody\"><span class=\"rlabel\">Orta</span>RESET/SIFIRLA mavi B100DM <span class=\"chip\" data-code=\"10 00272\">10 00272</span>. KBN 2B'de solunda START, sağında STOP. KBN 1B'de ORDEL varsa START/STOP yok, yerine YIKAMA ve ISITICI beyaz lamba.</div></li>", "R14.4": "<li class=\"rule r\" id=\"R14.4\"><a class=\"rid\" href=\"#R14.4\">R14.4</a><div class=\"rbody\"><span class=\"rlabel\">Çift el</span>iki kapak aç (yeşil) sola, iki kapak kapat (kırmızı) sağa; aynı taraftaki iki buton arasında dikey en az 25–30 cm. Etiket dar kalır, dikey uzar.</div></li>", "R14.5": "<li class=\"rule r\" id=\"R14.5\"><a class=\"rid\" href=\"#R14.5\">R14.5</a><div class=\"rbody\"><span class=\"rlabel\">Yağ sıyırıcı opsiyonu</span>KBN 1B ve LYM'de etikette OIL SEPERATOR / YAĞ SIYIRICI yeri her zaman vardır. <strong>Opsiyon varsa</strong> butonu <strong>sola</strong>, lambası <strong>sağa</strong> konur: BUTON MANDAL B100S20 <span class=\"chip\" data-code=\"10 00262\">10 00262</span> (1 NO) + SİNYAL LAMBASI S14B BEYAZ 220V <span class=\"chip\" data-code=\"10 00279\">10 00279</span>; ikisi ve kontak bloğu depo listesine yazılır (R4.7c, R0.6). <strong>Opsiyon yoksa</strong> iki delik <strong>tapa</strong> ile kapatılır (sol büyük buton tapası, sağ küçük lamba tapası). KBN 2B'de yağ sıyırıcı etikette yoktur, ekrandan kumanda edilir.</div></li>", "R14.6": "<li class=\"rule r\" id=\"R14.6\"><a class=\"rid\" href=\"#R14.6\">R14.6</a><div class=\"rbody\">Etikette çizilen her buton, lamba ve kontak bloğu depo listesinde vardır; etikette olmayan buton depo listesine yazılmaz. <strong>İstisna — tapa:</strong> buton ve lamba tapaları etiket çiziminde görsel olarak gösterilir, depo listesine yazılmaz.</div></li>", "R14.7": "<li class=\"rule r\" id=\"R14.7\"><a class=\"rid\" href=\"#R14.7\">R14.7</a><div class=\"rbody\"><span class=\"rlabel\">TMŞ kolu</span>KBN 2B'de TMŞ döner kolu (LV429338) <strong>pano kapağına</strong> takılır; etikette yer almaz, etiket çiziminde gösterilmez.</div></li>", "R14.8": "<li class=\"rule r\" id=\"R14.8\"><a class=\"rid\" href=\"#R14.8\">R14.8</a><div class=\"rbody\"><span class=\"rlabel\">LYM etiketi</span>dar dikey etiket, yukarıdan aşağı aşağıdaki sırayla. Sol/sağ sütun hizası korunur.</div></li>", "R14.9": "<li class=\"rule r\" id=\"R14.9\"><a class=\"rid\" href=\"#R14.9\">R14.9</a><div class=\"rbody\"><span class=\"rlabel\">LYM uyarı lambaları</span>3 adet SİNYAL LAMBASI S14K KIRMIZI 220V <span class=\"chip\" data-code=\"10 00278\">10 00278</span>: INADEQUATE WATER LEVEL, REDUCTOR FAILURE, PUMP FAILURE.</div></li>", "R14.10": "<li class=\"rule r\" id=\"R14.10\"><a class=\"rid\" href=\"#R14.10\">R14.10</a><div class=\"rbody\"><span class=\"rlabel\">LYM'de olmayanlar</span>ORDEL, ekran, çift el kapak aç/kapat butonları, sepet test adı (buton yalnız «TEST» yazar).</div></li>", "Q15": "<li class=\"rule q\" id=\"Q15\"><a class=\"rid\" href=\"#Q15\">Q15</a><div class=\"rbody\">KBN 2B: TS002 (sıcaklık) ve ADB21 (analog) modülleri her panoda 1'er adet mi, sensör sayısına göre artar mı?</div></li>", "Q16": "<li class=\"rule q\" id=\"Q16\"><a class=\"rid\" href=\"#Q16\">Q16</a><div class=\"rbody\">KBN 2B: Her kontaktör ve valf için bir PLC çıkışı ve bir yaprak röle mi sayılıyor? Lambalar da çıkış/röle alıyor mu?</div></li>", "Q17": "<li class=\"rule q\" id=\"Q17\"><a class=\"rid\" href=\"#Q17\">Q17</a><div class=\"rbody\">KBN 1B döner nozzle: 6 sokete çıkınca eklenen 2 röle 220V (RXM4AB1P7) mi, 24V (RXM4AB1BD) mi?</div></li>", "Q18": "<li class=\"rule q\" id=\"Q18\"><a class=\"rid\" href=\"#Q18\">Q18</a><div class=\"rbody\">KBN 2B etiketinde uyarı lambaları var mı (KBN 1B/LYM'deki 3 kırmızı gibi)?</div></li>", "Q19": "<li class=\"rule q\" id=\"Q19\"><a class=\"rid\" href=\"#Q19\">Q19</a><div class=\"rbody\">Klemens: faz/nötr/toprak/kumanda/sensör klemenslerinin stok adı ve kodları; motor 4, ısıtıcı 3 dışında sayım kuralı.</div></li>", "Q20": "<li class=\"rule q\" id=\"Q20\"><a class=\"rid\" href=\"#Q20\">Q20</a><div class=\"rbody\">Selenoid valf: kumanda gerilimi, sigortası, KBN 1B/LYM'de rölesi, KBN 2B'de çıkışı ve stok kodları.</div></li>", "Q21": "<li class=\"rule q\" id=\"Q21\"><a class=\"rid\" href=\"#Q21\">Q21</a><div class=\"rbody\">Pano kutusu, DIN ray, kablo kanalı, kablo, yüksük depo listesine yazılıyor mu? Yazılıyorsa stok kodları.</div></li>", "Q22": "<li class=\"rule q\" id=\"Q22\"><a class=\"rid\" href=\"#Q22\">Q22</a><div class=\"rbody\">Seri sınırları: 11 kW (25 A) üstü motor, tablo dışındaki güçler (0,18 / 0,25 / 15 kW …) için In kaynağı ve 0,4 / 7,5 kW dışındaki invertör boyları.</div></li>"}, "shared": ["R0.2", "R0.3", "R0.4", "R0.5", "R0.6", "R2.1", "R2.6", "R2.7", "R2.7a", "R2.8", "R3.1", "R10.3", "R10.6"]};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nm=c=>D.names[c]||c, ph=c=>D.photos[c];
const R=id=>`<a class="rid" href="kurallar.html#${id}" title="Kuralı aç">${id}</a>`;
let cur=null, opts={};
const EXCL={io20:'io40',io40:'io20'}; // birbirini dışlayan opsiyonlar
try{cur=localStorage.getItem('pm');}catch(e){}
if(location.hash)cur=location.hash.slice(1);
if(!D.models.find(m=>m.id===cur))cur=D.models[0].id;

function comp(c,m){
  if(!c)return '<div></div>';
  let dim='';
  if(c.opt&&!opts[c.opt]){ if(c.off) c=Object.assign({},c.off,{l:c.l}); }
  const t=c.t; let g='';
  if(t==='estop')g='<div class="estop"><i></i></div>';
  else if(t==='btn')g=`<div class="btn"><i class="c-${c.c}"></i></div>`;
  else if(t==='lamp')g=`<div class="lamp"><i class="c-${c.c}"></i></div>`;
  else if(t==='twin')g='<div class="twin"><i class="c-green"></i><i class="c-red"></i></div>';
  else if(t==='sel')g='<div class="sel"><i></i></div>';
  else if(t==='mandal')g='<div class="mandal"><i></i></div>';
  else if(t==='disp')g=`<div class="disp${c.big?' big':''}"><em>${esc(c.txt||c.l)}</em><b>${c.big?'85°C':'10.0'}</b></div>`;
  else if(t==='hmi')g='<div class="hmi"><i></i></div>';
  else if(t==='pako')g='<div class="pako"><i></i></div>';
  else if(t==='tms')g='<div class="tms"><i></i></div>';
  else if(t==='tapaB')g='<div class="tapaB"></div>';
  else if(t==='tapaL')g='<div class="tapaL"></div>';
  let pop='';
  if(c.code){const p=ph(c.code);
    const kb=kbOf(c); const kbs=kb?`<div style="margin-top:3px">${kb[0]} NO · ${kb[1]} NC</div>`:'';
    pop=`<div class="pop">${p?`<img src="${p}">`:''}<div>${esc(nm(c.code))}</div><code>${esc(c.code)}</code>${kbs}</div>`;}
  else if(t.startsWith('tapa'))pop='<div class="pop">Tapa — opsiyon yok.<br>Depo listesine yazılmaz (R14.6).</div>';
  return `<div class="comp${dim}">${pop}<div class="lt">${esc(c.l)}</div>${g}</div>`;
}
function kbOf(c){ if(!c.kb)return null; let k=c.kb.slice(); if(c.kbOpt)for(const o in c.kbOpt)if(opts[o]){k[0]+=c.kbOpt[o][0];k[1]+=c.kbOpt[o][1];} return k;}
function labelHTML(m){
  const L=m.label; let h=`<div class="label">`;
  for(const [x,y] of [[6,6],[279,6],[6,'b'],[279,'b']]) h+=`<span class="screw" style="left:${x}px;${y==='b'?'bottom:6px':'top:6px'}"></span>`;
  h+=`<div class="brand">${esc(L.brand)}${L.sub?`<small>${esc(L.sub)}</small>`:''}</div>`;
  for(const row of L.rows){
    if(row==='CIFT_EL'){
      const a={t:'btn',c:'green',l:'KAPAK AÇ',code:'10 00273',kb:[1,1]}, k={t:'btn',c:'red',l:'KAPAK KAPAT',code:'10 00271',kb:[1,1]};
      h+=`<div class="ciftel"><div class="col">${comp(a)}${comp(a)}</div><div class="dimv"><span>≥ 25–30 cm</span></div><div class="gap"><span>yatay mesafe serbest</span></div><div class="col">${comp(k)}${comp(k)}</div></div>`;
      continue;}
    h+=`<div class="lrow">${row.map(c=>comp(c,m)).join('')}</div>`;
  }
  return h+'</div>';
}
function labelComps(m){
  const out=[];
  for(const row of m.label.rows){
    if(row==='CIFT_EL'){out.push({code:'10 00273',kb:[1,1]},{code:'10 00273',kb:[1,1]},{code:'10 00271',kb:[1,1]},{code:'10 00271',kb:[1,1]});continue;}
    for(let c of row){ if(!c)continue; if(c.opt&&!opts[c.opt])continue; out.push(c);}
  }
  return out;
}
function contacts(m){
  let no=0,nc=0;
  for(const c of labelComps(m)){const k=kbOf(c); if(k){no+=k[0];nc+=k[1];}}
  for(const o of m.options)if(opts[o.key]){no+=o.kb[0];nc+=o.kb[1];}
  return [no,nc];
}
function itemCard(it,extra){
  if(it.series){const p=ph(it.photo);
    return `<div class="item series"><div class="ph">${p?`<img src="${p}">`:''}</div><div><div class="nm">${esc(it.series)}</div>
    <div class="meta"><span class="qty txt">${esc(it.choices)}</span>${R(it.rule)}</div><div class="nt">${esc(it.note)}</div></div></div>`;}
  const p=ph(it.code), q=typeof it.qty==='number'?`<span class="qty">× ${it.qty}</span>`:`<span class="qty txt">${esc(it.qty)}</span>`;
  return `<div class="item${extra||''}"><div class="ph">${p?`<img src="${p}">`:''}</div><div><div class="nm">${esc(nm(it.code))}</div>
  <div class="meta"><span class="code">${esc(it.code)}</span>${q}${it.rule?R(it.rule):''}</div>${it.note?`<div class="nt">${esc(it.note)}</div>`:''}</div></div>`;
}
function depo(m){
  const rows=new Map();
  const add=(code,qty,src,o)=>{const r=rows.get(code)||{code,qty:0,txt:[],src:new Set(),o:false};
    if(typeof qty==='number')r.qty+=qty;else r.txt.push(qty); r.src.add(src); r.o=r.o||o; rows.set(code,r);};
  for(const it of m.standard)if(it.code)add(it.code,it.qty,'Standart',false);
  // etiket elemanları: pako/TMŞ seri olarak, ekran/ORDEL/GEMO standart listede zaten sayılır
  const lab={}, labOpt={};
  for(const c of labelComps(m)){
    if(!c.code||c.t==='pako'||c.t==='tms')continue;
    if(m.standard.some(s=>s.code===c.code))continue;
    lab[c.code]=(lab[c.code]||0)+1; if(c.opt)labOpt[c.code]=true;}
  for(const k in lab)add(k,lab[k],'Etiket',!!labOpt[k]);
  for(const o of m.options)if(opts[o.key])for(const [c,q] of o.items){ if(m.label.rows.flat().some(x=>x&&x.opt===o.key&&x.code===c))continue; add(c,q,o.title,true);}
  const [no,nc]=contacts(m); add('10 00267',no,'Kontak (R9)',false); add('10 00268',nc,'Kontak (R9)',false);
  let h='<div class="tw"><table><thead><tr><th>Foto</th><th>Malzeme</th><th>Kod</th><th>Adet</th><th>Kaynak</th></tr></thead><tbody>';
  for(const it of m.standard)if(it.series)h+=`<tr><td class="c">${ph(it.photo)?`<img src="${ph(it.photo)}">`:''}</td><td>${esc(it.series)} <span style="color:var(--mute)">(${esc(it.choices)})</span></td><td class="c">akıma göre</td><td class="c">${esc(it.note)}</td><td class="c">${R(it.rule)}</td></tr>`;
  for(const r of rows.values()){ if(!r.qty&&!r.txt.length)continue;
    const q=[r.qty?r.qty:null,...r.txt].filter(Boolean).join(' + ');
    h+=`<tr class="${r.o?'o':''}"><td class="c">${ph(r.code)?`<img src="${ph(r.code)}">`:''}</td><td>${esc(nm(r.code))}</td><td class="c"><span class="code">${esc(r.code)}</span></td><td class="c"><b>${esc(q)}</b></td><td class="c" style="font-size:12px;color:var(--mute)">${esc([...r.src].join(', '))}</td></tr>`;}
  return h+'</tbody></table></div>';
}
function render(){
  const m=D.models.find(x=>x.id===cur);
  document.getElementById('tabs').innerHTML=D.models.map(x=>`<button class="${x.id===cur?'on':''}" data-id="${x.id}">${esc(x.name)}</button>`).join('');
  const [no,nc]=contacts(m);
  let h=`<div class="hero"><div><div class="tag">${esc(m.tag)}</div><h1>${esc(m.name)}</h1><p>${esc(m.desc)}</p></div></div>`;
  h+='<div class="facts">'+m.facts.map(([k,v,r])=>`<div class="fact">${R(r)}<span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')+'</div>';
  h+=`<div class="grid"><div class="card"><h2><span class="h2i">▣</span>Pano etiketi</h2><p class="sub">Elemanın üzerine gel: malzeme, kod, kontak.</p>
     <div class="labelwrap">${labelHTML(m)}</div><div class="lnote">${esc(m.label.note)}</div></div><div>`;
  h+=`<div class="card"><h2><span class="h2i">⚙</span>Opsiyonlar</h2><p class="sub">Aç/kapat — etiket, depo listesi ve kontak sayısı birlikte güncellenir (R1.5).</p><div class="opts">`;
  for(const o of m.options){
    h+=`<div class="opt${opts[o.key]?' on':''}" data-opt="${o.key}"><div class="sw"></div><div><b>${esc(o.title)}</b><p>${esc(o.desc)}</p><div class="minis">`+
      o.items.map(([c,q])=>`<span class="mini">${ph(c)?`<img src="${ph(c)}">`:''}${esc(c)} × ${q}</span>`).join('')+`</div></div>${R(o.rule)}</div>`;}
  h+=`</div><div class="kbbox"><div class="kb no"><b>${no}</b><span>NO kontak blok · B1 10 00267</span></div><div class="kb nc"><b>${nc}</b><span>NC kontak blok · B2 10 00268</span></div></div></div>`;
  h+=`<div class="card"><h2><span class="h2i">⚡</span>Yük eşlemeleri</h2><p class="sub">Hangi yük nasıl sürülür.</p><div class="loads">`+
     m.loads.map(([a,b,r])=>`<div class="load"><b>${esc(a)} ${R(r)}</b><span>${esc(b)}</span></div>`).join('')+'</div></div></div></div>';
  h+=`<div class="card"><h2><span class="h2i">★</span>Olmazsa olmazlar</h2><p class="sub">Bu modelde her panoda bulunan standart malzemeler. Kesik çerçeve: akıma göre seriden seçilir.</p><div class="items">`+
     m.standard.map(it=>itemCard(it)).join('')+'</div></div>';
  h+=`<div class="card"><h2><span class="h2i">☰</span>Depo listesi önizleme</h2><p class="sub">Standart + etiket + seçili opsiyonlar. Turuncu satırlar opsiyondan gelir. Motor ve ısıtıcı kalemleri projeye göre eklenir.</p>${depo(m)}</div>`;
  h+=`<div class="cols2"><div class="card"><h2><span class="h2i">§</span>${esc(m.name)} kuralları</h2><p class="sub">Bu modeli doğrudan ilgilendiren kurallar.</p><ul class="rules">`+
     m.rules.map(r=>D.rules[r]).join('')+`</ul></div><div class="card"><h2><span class="h2i">◎</span>Her modelde ortak</h2><p class="sub">Tüm panolarda geçerli temel kurallar.</p><ul class="rules">`+
     D.shared.map(r=>D.rules[r]).join('')+'</ul></div></div>';
  document.getElementById('main').innerHTML=h;
}
document.addEventListener('click',e=>{
  const t=e.target.closest('#tabs button'); if(t){cur=t.dataset.id;opts={};try{localStorage.setItem('pm',cur)}catch(_){} history.replaceState(null,'','#'+cur); render();window.scrollTo({top:0});return;}
  const o=e.target.closest('.opt'); if(o&&!e.target.closest('a')){const k=o.dataset.opt;opts[k]=!opts[k];
    if(opts[k]&&EXCL[k])opts[EXCL[k]]=false; render();}
});
document.getElementById('theme').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
r.dataset.theme=dark?'light':'dark';try{localStorage.setItem('kt',r.dataset.theme)}catch(e){}};
try{const t=localStorage.getItem('kt');if(t)document.documentElement.dataset.theme=t}catch(e){}
render();
</script>
</body></html>
